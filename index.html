<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Poly Mower</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Helvetica Neue', sans-serif;
            touch-action: none;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: env(safe-area-inset-top, 12px) 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        #hud > * {
            pointer-events: auto;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 8px 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        #progress-container {
            flex: 1;
            max-width: 240px;
            margin: 0 12px;
        }

        #progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #E8E0D8;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7CB342, #4CAF50);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        #progress-bar-mark {
            position: absolute;
            top: -2px;
            bottom: -2px;
            left: 80%;
            width: 2px;
            background: #FF7043;
            border-radius: 1px;
        }

        #progress-text {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #5D4037;
            margin-top: 4px;
        }

        #level-label {
            font-size: 15px;
            font-weight: 700;
            color: #5D4037;
        }

        #mower-label {
            font-size: 13px;
            font-weight: 600;
            color: #8D6E63;
        }

        /* Mower Start/Stop Button */
        #mower-btn {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
            right: 20px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            background: #4CAF50;
            color: white;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(76, 175, 80, 0.4);
            z-index: 20;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        #mower-btn:active {
            transform: scale(0.92);
        }

        #mower-btn.running {
            background: #FF7043;
            box-shadow: 0 4px 16px rgba(255, 112, 67, 0.4);
        }

        /* Virtual Joystick */
        #joystick-zone {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 60%;
            height: 50%;
            z-index: 15;
        }

        #joystick-base {
            display: none;
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.4);
            z-index: 16;
            transform: translate(-50%, -50%);
        }

        #joystick-thumb {
            display: none;
            position: fixed;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 17;
            transform: translate(-50%, -50%);
        }

        /* Menu Screens */
        .screen-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(135, 206, 235, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.4s ease;
        }

        .screen-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .screen-title {
            font-size: 48px;
            font-weight: 800;
            color: #5D4037;
            margin-bottom: 8px;
            text-shadow: 0 2px 0 rgba(255,255,255,0.3);
        }

        .screen-subtitle {
            font-size: 18px;
            color: #8D6E63;
            margin-bottom: 32px;
        }

        .menu-btn {
            background: #FF7043;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 112, 67, 0.35);
            margin: 8px;
            transition: transform 0.15s ease;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .menu-btn.secondary {
            background: #8D6E63;
            box-shadow: 0 4px 16px rgba(141, 110, 99, 0.35);
        }

        /* Level Select */
        #level-select-screen .level-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin-bottom: 24px;
        }

        .level-tile {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.15s ease;
            background: #A5D6A7;
            color: #2E7D32;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .level-tile:active {
            transform: scale(0.93);
        }

        .level-tile.locked {
            background: #D7CCC8;
            color: #A1887F;
        }

        .level-tile .stars {
            font-size: 12px;
            margin-top: 4px;
        }

        /* Level Complete */
        #complete-screen .result-stars {
            font-size: 48px;
            margin-bottom: 16px;
        }

        #complete-screen .result-text {
            font-size: 20px;
            font-weight: 600;
            color: #5D4037;
            margin-bottom: 24px;
        }

        .unlock-banner {
            background: #FFF9C4;
            border-radius: 12px;
            padding: 12px 24px;
            margin-bottom: 16px;
            font-weight: 600;
            color: #F57F17;
            box-shadow: 0 2px 8px rgba(245, 127, 23, 0.2);
        }

        /* Mower Select */
        #mower-select-screen .mower-grid {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mower-card {
            width: 140px;
            padding: 16px;
            border-radius: 16px;
            border: 3px solid transparent;
            background: white;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.2s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .mower-card:active {
            transform: scale(0.95);
        }

        .mower-card.selected {
            border-color: #FF7043;
        }

        .mower-card.locked {
            opacity: 0.5;
        }

        .mower-card .mower-name {
            font-weight: 700;
            color: #5D4037;
            margin-top: 8px;
            font-size: 14px;
        }

        .mower-card .mower-stat {
            font-size: 12px;
            color: #8D6E63;
        }

        .mower-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud" style="display:none;">
        <div class="hud-card">
            <div id="level-label">Yard 1</div>
        </div>
        <div class="hud-card" id="progress-container">
            <div id="progress-bar-bg">
                <div id="progress-bar-fill"></div>
                <div id="progress-bar-mark"></div>
            </div>
            <div id="progress-text">0%</div>
        </div>
        <div class="hud-card">
            <div id="mower-label">Buzz</div>
        </div>
    </div>

    <!-- Mower Button -->
    <button id="mower-btn" style="display:none;">START</button>

    <!-- Joystick Zone -->
    <div id="joystick-zone" style="display:none;"></div>
    <div id="joystick-base"></div>
    <div id="joystick-thumb"></div>

    <!-- Title Screen -->
    <div id="title-screen" class="screen-overlay">
        <div class="screen-title">Poly Mower</div>
        <div class="screen-subtitle">A cozy mowing sim</div>
        <button class="menu-btn" id="btn-play">Play</button>
    </div>

    <!-- Level Select -->
    <div id="level-select-screen" class="screen-overlay hidden">
        <div class="screen-title" style="font-size:32px;">Choose a Yard</div>
        <div class="level-grid" id="level-grid"></div>
        <button class="menu-btn secondary" id="btn-mowers">Mowers</button>
        <button class="menu-btn secondary" id="btn-back-title" style="margin-top:4px;">Back</button>
    </div>

    <!-- Mower Select -->
    <div id="mower-select-screen" class="screen-overlay hidden">
        <div class="screen-title" style="font-size:32px;">Choose a Mower</div>
        <div class="mower-grid" id="mower-grid"></div>
        <button class="menu-btn secondary" id="btn-back-levels">Back</button>
    </div>

    <!-- Level Complete -->
    <div id="complete-screen" class="screen-overlay hidden">
        <div class="result-stars" id="result-stars"></div>
        <div class="result-text" id="result-text"></div>
        <div class="unlock-banner hidden" id="unlock-banner"></div>
        <button class="menu-btn" id="btn-next-level">Next Yard</button>
        <button class="menu-btn secondary" id="btn-replay">Replay</button>
        <button class="menu-btn secondary" id="btn-to-levels" style="margin-top:4px;">Level Select</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="js/game.js"></script>
</body>
</html>
